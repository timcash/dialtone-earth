name: Check Registry

on:
  pull_request:
    paths:
      - "registry/**"
      - ".github/workflows/check-registry.yml"
      - ".github/workflows/deploy-registry.yml"

permissions:
  contents: read

concurrency:
  group: check-registry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registry
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: registry/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test registry data
        run: pnpm test

      - name: Build registry
        run: pnpm build
